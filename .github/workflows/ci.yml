name: Release gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Install dependencies and print versions
        run: |
          pacman -Syu --noconfirm --needed base-devel git ca-certificates cmake ninja boost openssl dbus python qt6-base qt6-tools qt6-translations qt6-declarative qt6-webengine xorg-server-xvfb xorg-xauth mesa qt6-5compat qt6-svg qtkeychain-qt6 gnome-keyring fontconfig noto-fonts
          pacman -Q base-devel git ca-certificates cmake ninja boost openssl dbus python qt6-base qt6-tools qt6-translations qt6-declarative qt6-webengine xorg-server-xvfb xorg-xauth mesa qt6-5compat qt6-svg qtkeychain-qt6 gnome-keyring fontconfig noto-fonts

      - name: Check out source and pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Git trust and headless runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third_party/nextkdeAppDemo"
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/nkmail-runtime.XXXXXX")
          chmod 0700 "$runtime_dir"
          printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir" >> "$GITHUB_ENV"

      - name: Test dependency guard
        run: python -m unittest discover -s tests/dependency -v

      - name: Verify published UI dependency
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_ui_dependency.py

      - name: Configure clean Release build and verify cache
        run: |
          test ! -e build/ci-release
          test -z "${NKMAIL_UI_SOURCE_DIR:-}"
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DNKMAIL_BUILD_TESTS=ON -DNKMAIL_REQUIRE_GOOGLE_OAUTH=ON -DNKMAIL_GOOGLE_OAUTH_CLIENT_FILE="$GITHUB_WORKSPACE/tests/oauth/project-client.fixture.json"
          python - <<'PY'
          import os
          from pathlib import Path

          cache = {}
          for line in Path("build/ci-release/CMakeCache.txt").read_text().splitlines():
              if line and not line.startswith(("#", "//")) and "=" in line:
                  key, value = line.split("=", 1)
                  cache[key] = value

          expected_ui = (Path(os.environ["GITHUB_WORKSPACE"]) / "third_party/nextkdeAppDemo").resolve(strict=True)
          actual_ui = Path(cache["NKMAIL_UI_SOURCE_DIR:PATH"]).resolve(strict=True)
          if actual_ui != expected_ui:
              raise SystemExit(f"Unexpected UI source: {actual_ui}; expected {expected_ui}")
          for key, expected in {"CMAKE_BUILD_TYPE:STRING": "Release", "NKMAIL_BUILD_TESTS:BOOL": "ON", "NKMAIL_REQUIRE_GOOGLE_OAUTH:BOOL": "ON"}.items():
              if cache.get(key) != expected:
                  raise SystemExit(f"Unexpected {key}: {cache.get(key)!r}; expected {expected!r}")
          print(f"Verified Release tests enabled with canonical UI source: {actual_ui}")
          PY

      - name: Build Release
        run: cmake --build build/ci-release --parallel 2

      - name: Verify required tests are registered
        run: |
          python - <<'PY'
          import json
          import subprocess

          listing = json.loads(subprocess.check_output(
              ["ctest", "--test-dir", "build/ci-release", "--show-only=json-v1"], text=True
          ))
          required = {"nkmail_i18n", "nkmail_translations", "nkmail_cli", "nkmail_ui", "nkmail_tray", "nkmail_core", "nkmail_controller", "loopback-protocol", "nkmail_reader", "nkmail_google_oauth"}
          registered = {test["name"] for test in listing["tests"]}
          missing = required - registered
          if missing:
              raise SystemExit(f"Missing required tests: {', '.join(sorted(missing))}")
          print(f"Verified required tests: {', '.join(sorted(required))}")
          PY

      - name: Run Release tests with Chromium sandbox enabled
        run: |
          useradd --create-home nkmail-ci
          chown -R nkmail-ci:nkmail-ci "$GITHUB_WORKSPACE" "$XDG_RUNTIME_DIR"
          runuser -u nkmail-ci -- env XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" ctest --test-dir build/ci-release --output-on-failure --no-tests=error --timeout 120

  arch-package:
    name: Arch Linux preview package
    needs: release-gate
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install build and runtime dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja boost openssl dbus python qt6-base qt6-tools qt6-translations qt6-declarative qt6-webengine qt6-5compat qt6-svg qtkeychain-qt6 gnome-keyring hicolor-icon-theme fontconfig noto-fonts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Export complete source and package recipe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third_party/nextkdeAppDemo"
          python scripts/export_release_source.py dist
          cp packaging/arch/PKGBUILD dist/PKGBUILD
          source_sha=$(sha256sum dist/nkmail-0.1.0rc1.tar.gz | cut -d ' ' -f1)
          sed -i "s/@SOURCE_SHA256@/$source_sha/" dist/PKGBUILD
          useradd --create-home nkmail-package
          chown -R nkmail-package:nkmail-package dist
      - name: Build from exported source as ordinary user
        run: runuser -u nkmail-package -- bash -c 'cd dist && makepkg --noconfirm'
      - name: Install and smoke-test the actual package
        run: |
          pacman -U --noconfirm dist/nkmail-0.1.0rc1-1-x86_64.pkg.tar.zst
          test -f /usr/share/applications/nkmail.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/nkmail.svg
          test -f /usr/share/licenses/nkmail/Kos.Ui-LICENSE
          test ! -e dist/src/build/.qt/rcc/qrc_google_oauth_project_config.cpp
          runuser -u nkmail-package -- python tests/cli/check_cli.py /usr/bin/nkmail
      - name: Create checksums and dependency record
        run: |
          pacman -Q > dist/BUILD-DEPENDENCIES.txt
          cd dist
          sha256sum nkmail-*.pkg.tar.zst nkmail-*.tar.gz PKGBUILD BUILD-DEPENDENCIES.txt > SHA256SUMS
      - name: Upload preview distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nkmail-arch-x86_64
          if-no-files-found: error
          path: |
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/PKGBUILD
            dist/SHA256SUMS
            dist/BUILD-DEPENDENCIES.txt
